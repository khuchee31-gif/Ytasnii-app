[preset.0]

name="Android"
platform="Android"
runnable=true
advanced_options=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
; Түүхий `.glb` файл ХЭРЭГГҮЙ: `humanoid.gd` нь импортлогдсон дүр зургийг
; ачаалдаг (жижиг, хурдан — ачаалалт 960 мс-ээс 400 мс болов). Эхэндээ
; түүхий байтаас задалдаг байсан бөгөөд тэр нь APK-д БҮТЭХГҮЙ байв.
include_filter="*.md"
; ХӨГЖҮҮЛЭЛТИЙН ХЭРЭГСЛҮҮД ТОГЛОГЧ РУУ ЯВАХГҮЙ.
;
; `export_filter="all_resources"` нь төслийн БҮХ нөөцийг савладаг тул
; `tools/` доторх хэмжилтийн скриптүүд ч APK-д ордог байв. Тэд ямар ч
; дүр зурагт холбогдоогүй, зөвхөн энд ажилладаг.
;
; `*.md` нь ХЭВЭЭР: `models/SOURCES.md` нь татаж авсан загваруудын
; эх сурвалж, лицензийг агуулдаг — тэр нь тоглогчтой хамт явах ёстой.
exclude_filter="shots/*, tools/*"
export_path="../build/hot-untlaa.apk"
encryption_include_filters=""
encryption_exclude_filters=""
seed=0
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
gradle_build/use_gradle_build=false
gradle_build/gradle_build_directory=""
gradle_build/android_source_template=""
gradle_build/compress_native_libraries=false
gradle_build/export_format=0
gradle_build/min_sdk=""
gradle_build/target_sdk=""
; ХОЁУЛАНГ НЬ ОРУУЛНА.
;
; Өмнө нь зөвхөн arm64 байв: «Redmi 9A бол 64 бит, 32 битийн хувилбар
; нэмэх нь APK-г хоёр дахин том болгоод хэрэглэгдэхгүй» гэж бичсэн.
; Тэр нь НЭГ утсанд үнэн, АНГИД худал.
;
; Энэ тоглоом ангийн БҮХ утсанд суух ёстой. 32 битийн утсанд arm64-ийн
; APK нь СУУНА, гэвч нээмэгц төрөлх номын сангаа олохгүй бөгөөд
; `UnsatisfiedLinkError` өгч ШУУД хаагдана — хэрэглэгчид «алдаа зааж
; шууд гарлаа» гэж л харагдана, шалтгаан нь хаана ч бичигдэхгүй.
;
; Үнэ нь ~25 МБ. Найзынхаа утсанд ажиллахгүй тоглоомоос хамаагүй хямд.
architectures/armeabi-v7a=true
architectures/arm64-v8a=true
architectures/x86=false
architectures/x86_64=false
version/code=2
version/name="0.2"
package/unique_name="mn.khuchee.hotuntlaa"
package/name="Хот унтлаа"
package/signed=true
package/app_category=2
package/retain_data_on_uninstall=false
package/exclude_from_recents=false
package/show_in_android_tv=false
package/show_in_app_library=true
package/show_as_launcher_app=false
launcher_icons/main_192x192=""
launcher_icons/adaptive_foreground_432x432=""
launcher_icons/adaptive_background_432x432=""
graphics/opengl_debug=false
xr_features/xr_mode=0
screen/immersive_mode=true
screen/support_small=true
screen/support_normal=true
screen/support_large=true
screen/support_xlarge=true
user_data_backup/allow=false
command_line/extra_args=""
apk_expansion/enable=false
apk_expansion/SALT=""
apk_expansion/public_key=""
permissions/custom_permissions=PackedStringArray()
; ЗӨВХӨН ХОЁР зөвшөөрөл: сүлжээ (сервер) ба микрофон (ярих).
; Байршил, харилцагч, хадгалах сан гэх мэт юу ч хэрэггүй — асуувал
; хэрэглэгч эргэлзэнэ, зөв нь ч биш.
permissions/internet=true
permissions/access_network_state=true
permissions/record_audio=true
permissions/modify_audio_settings=true
; ЧИЧИРГЭЭ. `sfx.gd` нь `Input.vibrate_handheld()` дууддаг; энэ мөргүй
; бол Android тэр дуудлагыг SecurityException-оор няцаана. VIBRATE нь
; «энгийн» зөвшөөрөл тул суулгах үед өгөгддөг — хэрэглэгчээс асуухгүй.
permissions/vibrate=true
; RELEASE-ийг ЯГ ТЭР ДИБАГ ТҮЛХҮҮРЭЭР гарын үсэг зурна.
;
; ЯАГААД RELEASE ВЭ: дибаг загварын төрөлх номын сан 76 МБ (дибаг
; тэмдэгтүүдтэй), release нь түүнээс хамаагүй жижиг. 2 ГБ-тай Go
; хувилбарын утсанд энэ нь бодит ялгаа.
;
; ЯАГААД ИЖИЛ ТҮЛХҮҮР ВЭ: өөр түлхүүрээр зурвал гарын үсэг таарахгүй
; бөгөөд хуучин суулгацын ДЭЭР шинэ APK СУУХГҮЙ. Хэрэглэгч эхлээд
; устгах хэрэгтэй болно — тэр нь өөрөө «алдаа» мэт харагдана.
; Ижил түлхүүр нь дээрээс нь шинэчлэхийг зөвшөөрнө.
keystore/release="/root/.local/share/godot/keystores/debug.keystore"
keystore/release_user="androiddebugkey"
keystore/release_password="android"
