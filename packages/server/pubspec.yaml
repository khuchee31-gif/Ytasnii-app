name: server
description: >-
  «Хот унтлаа» онлайн сервер. Дүрийг ЭНД хадгална — утсанд хэзээ ч бүтнээр
  нь илгээхгүй. Дүрмийн хөдөлгүүрийг (`packages/engine`) өөрчлөлтгүй ашиглана.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.9.0

dependencies:
  engine:
    path: ../engine
  protocol:
    path: ../protocol
  shelf: ^1.4.0
  shelf_web_socket: ^3.0.0
  web_socket_channel: ^3.0.0

dev_dependencies:
  lints: ^5.0.0
  test: ^1.25.0
